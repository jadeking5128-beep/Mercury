[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-security"
version = "0.2.0"
description = "Termux-first, AI-assisted security assessment platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mercury Contributors" }]
dependencies = ["dnspython>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.3", "httpx>=0.27"]

[project.scripts]
mercury = "mercury.cli:main"

[tool.setuptools.packages.find]
include = ["mercury*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
